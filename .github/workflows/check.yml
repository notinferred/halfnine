# Checks each push to main: the UI's lint, format, types and build, then the Rust crates' format, lints and tests against a
# real Postgres, and that the TypeScript bindings match the Rust commands.
# It holds no secrets and publishes nothing. A change to prose alone can't change a verdict, so Markdown and docs/ don't start it.
name: check

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      HN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The runner's own Docker engine, where postgres:18 is already pulled for the service above.
      HN_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm --filter @halfnine/desktop build

      # Tauri compiles against the system webview, which on Linux is WebKitGTK.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: psql "$HN_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f crates/pg/tests/fixture.sql
      - run: cargo test --workspace --locked
      # The tests rewrite the bindings from the Rust commands, so any difference means they weren't regenerated.
      - run: git diff --exit-code apps/desktop/src/ipc/bindings.ts
      # Whatever a failed test left behind; the tests label what they make.
      - if: always()
        run: |
          docker ps -aq --filter label=com.notinferred.halfnine.test | xargs -r docker rm -f
          docker volume ls -q --filter label=com.notinferred.halfnine.test | xargs -r docker volume rm -f
